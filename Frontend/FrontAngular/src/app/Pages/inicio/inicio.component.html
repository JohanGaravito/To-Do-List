<mat-card style="width:70%; margin: 50px auto">
    <mat-card-header>
        <mat-card-title><p>Lista de Tareas</p></mat-card-title>
    </mat-card-header>
  <mat-card-content>
        <button mat-stroked-button color="primary" (click)="Nuevo()">Agregar Tarea</button>
    <table mat-table [dataSource]="listaTareas" class="mat-elevation-z8" style="margin-top:20px">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="Titulo">
    <th mat-header-cell *matHeaderCellDef>Titulo</th>
    <td mat-cell *matCellDef="let element"> {{element.Titulo}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="Descripcion">
    <th mat-header-cell *matHeaderCellDef>Descripcion</th>
    <td mat-cell *matCellDef="let element"> {{element.Descripcion}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="Estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let element"> {{element.Estado}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="FechaCreacion">
    <th mat-header-cell *matHeaderCellDef>FechaCreacion</th>
    <td mat-cell *matCellDef="let element"> {{element.FechaCreacion}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="FechaActualizacion">
    <th mat-header-cell *matHeaderCellDef>FechaActualizacion</th>
    <td mat-cell *matCellDef="let element"> {{element.FechaActualizacion}} </td>
  </ng-container>

    <!-- Symbol Column -->
  <ng-container matColumnDef="Accion">
    <th mat-header-cell *matHeaderCellDef>Accion</th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="Editar(element)">
                <mat-icon>Estado</mat-icon>
            </button>
            <button mat-icon-button color="primary" (click)="Editar(element)">
                <mat-icon>Editar</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="Eliminar(element)">
                <mat-icon>Eliminar</mat-icon>
            </button>
        </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>
  </mat-card-content>
</mat-card>
